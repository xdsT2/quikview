name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  artwork:
    name: 素材溯源校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Pillow
        run: python -m pip install --upgrade pip pillow

      # 全量比对 resources/skin/*.png 的 SHA-256：
      # 任一文件被改动、或生成器与已提交素材不再一致，这里就会失败。
      - name: 校验素材哈希
        run: python tools/03_gen_skin.py --check

  build:
    name: Windows 构建 (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # 按 README「MSYS2 一键」那条路径构建：与开发者本地环境一致，
      # 顺带验证文档里写的依赖清单确实完整可用。
      - name: 安装工具链与依赖
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-imageformats
            mingw-w64-x86_64-libraw
            mingw-w64-x86_64-libheif

      - name: 配置
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/mingw64

      - name: 编译
        run: cmake --build build

      - name: 确认产物存在
        run: |
          test -f build/quikview.exe || { echo "quikview.exe 未生成"; exit 1; }
          ls -lh build/quikview.exe
