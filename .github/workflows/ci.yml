name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  artwork:
    name: 素材溯源校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Pillow
        run: python -m pip install --upgrade pip pillow

      # 全量比对 resources/skin/*.png 的 SHA-256：
      # 任一文件被改动、或生成器与已提交素材不再一致，这里就会失败。
      - name: 校验素材哈希
        run: python tools/03_gen_skin.py --check

  build:
    name: Windows 构建 (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # 按 README「MSYS2 一键」那条路径构建：与开发者本地环境一致，
      # 顺带验证文档里写的依赖清单确实完整可用。
      - name: 安装工具链与依赖
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # 不用 toolchain 包组：pacman 组选择提示在 --noconfirm 下仍会弹出，
          # 把后续包名当成选择输入吞掉（update:true 同步新库后必现）。逐个列包。
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-headers
            mingw-w64-x86_64-crt
            mingw-w64-x86_64-libstdc++
            mingw-w64-x86_64-winpthreads
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-libraw
            mingw-w64-x86_64-libheif

      # qt6-imageformats 单独装：setup-msys2 的批量 install 在 update:true 下
      # 报 target not found，但包在 mingw64 仓库确实存在（-any 架构）。单独一步更易诊断。
      - name: 安装 Qt 图像格式插件
        run: |
          echo "=== pacman -Ss qt6-imageformats ==="
          pacman -Ss qt6-imageformats || true
          echo "=== pacman -Si (精确) ==="
          pacman -Si mingw-w64-x86_64-qt6-imageformats || true
          echo "=== 已装 qt6 包 ==="
          pacman -Q | grep -i qt6 || true
          echo "=== 仓库配置 ==="
          cat /etc/pacman.conf | grep -A2 '^\[mingw64\]'

      - name: 配置
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/mingw64

      - name: 编译
        run: cmake --build build

      - name: 确认产物存在
        run: |
          test -f build/quikview.exe || { echo "quikview.exe 未生成"; exit 1; }
          ls -lh build/quikview.exe

      # tools/package.sh 要求两枚壳扩展 DLL 在位（属产品组件，缺了直接中止）。
      # 64 位走 MinGW；32 位按 shell-ext/README.md 需要 MSVC x86，而本 runner
      # 没有 Visual Studio 实例，CI 只能做构建烟测，故用显式变量跳过这一枚 DLL。
      # 正式发布包由本地 tools/package-installer.sh 生成，两枚 DLL 都必须齐备。
      - name: 构建 64 位壳扩展（MinGW）
        run: |
          cmake -S shell-ext -B build-shell64 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-shell64

      # 打包成可分发 zip 供下载验证（不进 release；发布走正式流程另行触发）
      # tools/package.sh：干净 staging + windeployqt + objdump 依赖闭包 + 自检，
      # 并剔除 qjp2/libjasper（该插件打开 .jp2 会触发 Jasper 断言）
      - name: 打包
        env:
          QUIKVIEW_CI_SKIP_SHELL32: "1"
        run: bash tools/package.sh build dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QuikView-win64
          path: dist/quikview-*-win64.zip
          retention-days: 14
          if-no-files-found: error
