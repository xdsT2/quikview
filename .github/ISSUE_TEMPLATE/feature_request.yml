name: 功能建议 / Feature request
description: 提出新的功能需求或体验改进建议
title: "[建议] "
labels: ["type:user-request"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您为 SoleView 提出功能建议！请尽量填写下方需求与使用场景，便于评估优先级与可行性。
  - type: textarea
    id: feature
    attributes:
      label: 功能描述（Feature Description）
      description: 请描述您希望新增或改进的功能，包括涉及的模块或操作环节。
      placeholder: 希望增加 ... 功能，能够在 ... 场景下完成 ...
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景（Use Case）
      description: 请说明该功能的典型使用场景、触发条件，以及涉及的图片格式、操作习惯等。
      placeholder: 当 ... 时，我通常会 ...，希望软件能够 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望效果（Expected Behavior）
      description: 请描述功能落地后您期望看到的具体表现，可参照现有交互或其他软件的做法。
      placeholder: 期望在 ... 之后，出现 ... 效果 / 交互 ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现状与替代方案（Current Workaround，选填）
      description: 可描述目前缺少该功能时的临时处理方式，或您了解到的其他替代方案。
      placeholder: 目前我只能先 ... 再 ...；也可参考 ... 的做法。
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 版本与环境（Version & Environment，选填）
      description: 可在软件「设置 → 关于」中查看版本号，并注明安装版或便携版、Windows 版本。
      placeholder: 设置 → 关于 里的版本号，例如：v0.6.0 安装版 / Windows 11
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 补充说明（Additional Notes，选填）
      description: 其他需要补充的想法或参考资料。注意：GitHub Issue 对所有人公开，请勿上传含个人信息的原图或截图。
      placeholder: 补充说明、参考截图（已脱敏）或链接等
    validations:
      required: false
